name: mubeen_flutter
description: "Mubeen device intelligence for Flutter: device fingerprinting and persistent device identity on Android and iOS."
version: 0.1.7+flutter3.22

# This package is distributed as a git dependency, not through pub.dev. `publish_to: none` makes
# `dart pub publish` refuse, so it cannot reach pub.dev by accident.
publish_to: none

environment:
  # Legacy build for apps on Flutter older than 3.44 (README, "This is the legacy build").
  # Floor proven locally on Flutter 3.22: analyze, tests, and a fresh app from that Flutter's
  # own template building this plugin into a release APK. Dart 3.4.0 is what Flutter 3.22.0
  # ships. Flutter 3.19 is below the floor: its Gradle plugin only wires plugins that have
  # android/build.gradle, not build.gradle.kts.
  # <3.12.0 is the real guard: Flutter 3.44 ships Dart 3.12, so on 3.44+ `pub get` refuses
  # this build and points the app at the main build (`v0.1.7`). Pub enforces only the lower
  # bound of the flutter constraint below, so its upper bound is documentation.
  sdk: '>=3.4.0 <3.12.0'
  flutter: '>=3.22.0 <3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 4.x resolves on Dart 3.4 (the floor); 6.x needs Dart 3.8.
  flutter_lints: '>=4.0.0 <7.0.0'
  # Range, not ^29: pub picks 29.x on new Dart and 22.x on Dart 3.4/3.5 (Flutter 3.22/3.24),
  # so `flutter pub get` works on the floor. Codegen only; regenerate with 29.x.
  pigeon: '>=22.7.2 <30.0.0'

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: ai.mubeen.mubeen_flutter
        pluginClass: MubeenFlutterPlugin
      ios:
        pluginClass: MubeenFlutterPlugin

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
